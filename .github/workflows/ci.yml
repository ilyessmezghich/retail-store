name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (tests + alembic check)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail_test_password
          POSTGRES_DB: retail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail -d retail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://retail:retail_test_password@localhost:5432/retail_test
      JWT_SECRET: ci-only-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_replace_me
      STRIPE_WEBHOOK_SECRET: whsec_ci_only
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify app imports cleanly
        run: python -c "from app.main import app; assert app is not None; print('backend imports ok')"

      - name: Run backend tests
        run: pytest

      - name: Alembic migrations apply + drift check
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint / type-check
        run: npm run lint

      - name: Build
        run: npm run build

  docker-publish:
    name: Docker (build & push to Docker Hub)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    strategy:
      matrix:
        include:
          - context: ./backend
            image: medmez/retail-store-backend
          - context: ./frontend
            image: medmez/retail-store-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}