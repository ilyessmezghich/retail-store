name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (tests + alembic check)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail_test_password
          POSTGRES_DB: retail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail -d retail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://retail:retail_test_password@localhost:5432/retail_test
      JWT_SECRET: ci-only-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_replace_me
      STRIPE_WEBHOOK_SECRET: whsec_ci_only
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify app imports cleanly
        run: python -c "from app.main import app; assert app is not None; print('backend imports ok')"

      - name: Run backend tests
        run: pytest

      - name: Alembic migrations apply + drift check
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint / type-check
        run: npm run lint

      - name: Build
        run: npm run build

  docker-publish:
    name: Docker (build & push to Docker Hub)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    strategy:
      matrix:
        include:
          - context: ./backend
            image: medmez/retail-store-backend
          - context: ./frontend
            image: medmez/retail-store-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

  security:
    name: Security Scan (full stack)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # for SARIF uploads later

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem / all manifests)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ""
          format: table
          exit-code: "0"          # 0 = warn only (non-blocking)
          severity: HIGH,CRITICAL

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: retail-store-sbom.spdx
          format: spdx-json

      - name: Run Trivy on backend requirements (pip audit via trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL

  secrets:
    name: Secret & SAST scan (gitleaks + bandit + npm-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history for gitleaks

      - name: GitLeaks — scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python + Bandit (backend SAST)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bandit static analysis (backend)
        run: |
          pip install bandit
          cd backend && bandit -r app -f json -o bandit.json || true   # warn only
          echo "Bandit findings:"
          python -c "import json;d=json.load(open('bandit.json'));print(sum(len(f['results']) for f in d['results']))" 2>/dev/null || true

      - name: npm audit (frontend deps)
        run: |
          cd frontend && npm audit --audit-level=high || true          # warn only

      - name: Upload security reports (optional, keeps artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            **/bandit.json
            **/*sbom*.spdx
            **/trivy*.json
          if-no-files-found: ignore
          retention-days: 14

  docker-scan:
    name: Docker image scan (Trivy) + cosign attest
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      matrix:
        include:
          - image: medmez/retail-store-backend
          - image: medmez/retail-store-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Scan pushed Docker image with Trivy (warn only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}:latest
          format: table
          exit-code: "0"           # non-blocking
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Sign image provenance with cosign (keyless via GitHub OIDC)
        uses: sigstore/cosign-installer@v3
      - name: Upload SBOM as attestation (keyless, warn-only)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          echo "Cosign keyless attestation placeholder — requires a container registry that supports it (Docker Hub does not natively store OCI attestations)."
          echo "For full supply-chain attestation, push to GHCR, then cosign attest-back --type spdx <image>."
          exit 0